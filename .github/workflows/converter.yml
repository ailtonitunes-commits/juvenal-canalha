name: Converter Reels
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: fila
  cancel-in-progress: false
jobs:
  converter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "juvenal-bot"
          git config user.email "juvenal-bot@users.noreply.github.com"
      - id: tarefa
        run: python scripts/converter_reels.py
      - if: steps.tarefa.outputs.mudou == 'true'
        run: gh workflow run site.yml
        env:
          GH_TOKEN: ${{ github.token }}
