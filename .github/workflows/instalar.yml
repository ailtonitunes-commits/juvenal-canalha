name: Instalar
on:
  push:
    branches: [main]
    paths: [".github/workflows/instalar.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f juvenal-canalha-automacao.zip || exit 0
          unzip -q juvenal-canalha-automacao.zip -d /tmp/pacote
          rm -rf /tmp/pacote/juvenal-bot/.git /tmp/pacote/juvenal-bot/.github
          cp -a /tmp/pacote/juvenal-bot/. .
          rm juvenal-canalha-automacao.zip
          git config user.name "juvenal-bot"
          git config user.email "juvenal-bot@users.noreply.github.com"
          git add -A
          git commit -m "Instala o projeto"
          git push origin HEAD:main
